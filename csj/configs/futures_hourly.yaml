evaluation:
  sample_count: 10
  temperature: 1.0
  top_k: 0
  top_p: 0.9
  inference_batch_size: 2
  random_seed: 20260805
  bootstrap_iterations: 2000
  bootstrap_block_days: 5

output:
  root: csj/runs/futures_hourly
